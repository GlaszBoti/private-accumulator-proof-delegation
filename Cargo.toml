[package]
name = "privacy-preserving-accumulators"
version = "0.1.0"
edition = "2021"

[features]
default = ["rsa", "bilinear"]
rsa = ["num-bigint", "num-traits", "num-integer", "glass_pumpkin"]
bilinear = ["ark-ec", "ark-ff", "ark-std", "ark-poly", "ark-poly-commit", "ark-bls12-381"]
class-group = ["class_group", "curv"]

[dependencies]
rand = "0.8"

num-bigint = { version = "0.4", features = ["rand"], optional = true }
num-traits = { version = "0.2", optional = true }
num-integer = { version = "0.1", optional = true }
glass_pumpkin = { version = "1.0", optional = true }

ark-ec = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }
ark-std = { version = "0.4", optional = true }
ark-poly = { version = "0.4", optional = true }
ark-poly-commit = { version = "0.4", optional = true }
ark-bls12-381 = { version = "0.4", optional = true }
Gen_Prime = "=1.1.9"
rust-miller-rabin = "0.1.4"
sha256 = "1.6.0"
criterion = "0.5"
class_group = {version = "0.6.1", optional = true}
curv = { package = "curv-kzen", version = "0.10", default-features = false, optional = true}

[[bench]]
name = "bench_rsa"
harness = false
